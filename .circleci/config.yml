# Excavator auto-updates this file. Please contribute improvements to the central template:
# https://github.palantir.build/excavator-checks/circle-templates/blob/develop/excavator/circleci/templates/rust-library.config.yml
# To manually manage the CircleCI configuration for this project, remove the .circleci/template.sh file.

orbs:
  cache: palantir-orbs/circle-cache@volatile
  secret-injector: palantir-orbs/secret-injector@0.1.0

version: 2.1
jobs:
  build:
    machine:
      image: docker-27
      docker_layer_caching: false
    resource_class: xlarge
    environment:
      RUSTFLAGS: -Dwarnings
      CARGO_BUILD_JOBS: 4
      RUST_BACKTRACE: 1
    steps:
      - checkout
      - run:
          name: Install Rust toolchain
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo 'source $HOME/.cargo/env' >> $BASH_ENV
      - run:
          name: Install protoc
          command: |
            curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip
            sudo unzip -o protoc-25.1-linux-x86_64.zip -d /usr/local bin/protoc 'include/*'
            rm protoc-25.1-linux-x86_64.zip
      - cache/restore: { keys: registry- }
      - run: test -f Cargo.lock || cargo generate-lockfile
      - cache/restore: { keys: 'deps-v2-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}' }
      - run: cargo fmt --all -- --check
      - run: |
          cargo clippy --all --all-targets --locked
      - run:
          name: Start test infrastructure (pre-built images only)
          command: docker compose -f dev/docker-compose.yaml up -d 
      - run:
          name: Run tests
          command: cargo test --all --locked
      - run:
          name: Cleanup Docker
          command: docker compose -f dev/docker-compose.yaml down -v --remove-orphans --timeout 0
          when: always
      - cache/save:
          key: registry-{{ .BuildNum }}
          paths: ~/.cargo/registry/index
      - cache/save:
          key: 'deps-v2-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}'
          paths: |
            target
            ~/.cargo/git
            ~/.cargo/registry/src
            ~/.cargo/registry/cache
      - secret-injector/check
      - run: |
          if [[ -z ${CIRCLE_TAG+x} ]]; then
            exit 0
          fi

          # Requires Rust 1.90.0+
          cargo publish \
            --registry palantir \
            --token "Basic $(echo -n $ARTIFACTORY_USERNAME:$ARTIFACTORY_PASSWORD | base64 -w0)" \
            --workspace \
            --no-verify

  circle-all:
    docker: [{ image: 'hub.docker.palantir.build/busybox:1.36.1@sha256:6d9ac9237a84afe1516540f40a0fafdc86859b2141954b4d643af7066d598b74' }]
    resource_class: small
    steps:
      - run: {command: echo "All required jobs finished successfully"}

workflows:
  version: 2
  build:
    jobs:
      - build:
          filters: { tags: { only: /.*/ } }

      # Catch-all for all required checks
      - circle-all:
          requires: [ build ]
          filters: { tags: { only: /.*/ } }
